name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dockerfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check the Dockerfile
        run: docker buildx build --check --file docker/Dockerfile .

  image:
    # The container image builds (pushed only from main and tags, container.yaml).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  core:
    # scopes-core, the unit tests and the benchmark: no libmxl, no nmos-cpp.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build
      - name: Configure and build
        # Bounds-checked standard containers in the unit tests (-D_GLIBCXX_ASSERTIONS).
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-D_GLIBCXX_ASSERTIONS
          cmake --build build -j"$(nproc)"
      - name: Unit tests
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -q avx2 /proc/cpuinfo && echo "runner has AVX2" || echo "runner has no AVX2: the AVX2 engine tests are skipped"
          ./build/unit-tests
      - name: Benchmark (informative)
        run: ./build/mxl-scopes-bench --iterations 30 --strips 64,512 --steps 1/1,2/1 --pattern bars75 --modes luma,ycbcr-parade,rgb-parade,rgb-overlay

  tsan:
    # The strip workers (SCOPES_THREADS) under ThreadSanitizer: the thread tests, fewer cases.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build
      - name: Build with -fsanitize=thread
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
          cmake --build build -j"$(nproc)" --target unit-tests
      - name: Thread tests
        # setarch -R: ThreadSanitizer does not run with the kernel's full address randomisation.
        run: SCOPES_TEST_QUICK=1 TSAN_OPTIONS=halt_on_error=1 setarch "$(uname -m)" -R ./build/unit-tests -tc="*worker*,*strip workers*"

  build-and-test:
    runs-on: ubuntu-24.04
    env:
      MXL_REF: 218ddaa0a08c12ffe75fc475ae65aa3d9eef16d7
      NMOS_CPP_REF: fe303849527394b03bdedc8f161f377fe458bb62
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl zip unzip tar \
            bison flex autoconf automake libtool \
            libboost-system-dev libboost-thread-dev libboost-chrono-dev \
            libboost-date-time-dev libboost-regex-dev libboost-random-dev \
            libboost-filesystem-dev libcpprest-dev nlohmann-json3-dev \
            libssl-dev uuid-dev libavahi-compat-libdnssd-dev \
            libavcodec-dev libavformat-dev libavutil-dev

      - name: Build MXL
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          git init /tmp/mxl
          git -C /tmp/mxl remote add origin https://github.com/dmf-mxl/mxl.git
          git -C /tmp/mxl fetch --depth 1 origin "$MXL_REF"
          git -C /tmp/mxl checkout FETCH_HEAD
          python3 - <<'PY'
          import json, pathlib, subprocess
          baseline = subprocess.check_output(["git", "-C", "/opt/vcpkg", "rev-parse", "HEAD"], text=True).strip()
          doc = json.loads(pathlib.Path("docker/mxl-vcpkg.json").read_text())
          doc["builtin-baseline"] = baseline
          pathlib.Path("/tmp/mxl-manifest/vcpkg.json").parent.mkdir(parents=True, exist_ok=True)
          pathlib.Path("/tmp/mxl-manifest/vcpkg.json").write_text(json.dumps(doc))
          PY
          cmake -S /tmp/mxl -B /tmp/mxl/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_MANIFEST_DIR=/tmp/mxl-manifest \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DBUILD_UTILS=OFF -DBUILD_DOCS=OFF \
            -DMXL_ENABLE_FABRICS_OFI=OFF \
            -DCMAKE_INSTALL_PREFIX=/opt/mxl
          cmake --build /tmp/mxl/build -j"$(nproc)"
          sudo cmake --install /tmp/mxl/build

      - name: Fetch nmos-cpp
        run: |
          git init /tmp/nmos-cpp
          git -C /tmp/nmos-cpp remote add origin https://github.com/sony/nmos-cpp.git
          git -C /tmp/nmos-cpp fetch --depth 1 origin "$NMOS_CPP_REF"
          git -C /tmp/nmos-cpp checkout FETCH_HEAD

      - name: Configure and build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSCOPES_WITH_NMOS=ON \
            -DNMOS_CPP_DIR=/tmp/nmos-cpp/Development \
            -DCMAKE_PREFIX_PATH="/opt/mxl;/tmp/mxl/build/vcpkg_installed/x64-linux"
          cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ./build/unit-tests

      - name: Exit codes
        run: |
          set +e
          ./build/mxl-scopes --version; test $? -eq 0 || exit 1
          SCOPES_MODE=rainbow ./build/mxl-scopes; test $? -eq 78 || exit 1
          SCOPES_STATE_DIR=/tmp/scopes-exit NMOS_ENABLE=false MXL_DOMAIN_SCAN_PATH=/dev/shm MXL_OUTPUT_DOMAIN_DIR=/dev/shm/scopes-exit WEB_PORT=22 \
            ./build/mxl-scopes; test $? -eq 75 || exit 1
          # The NMOS port taken by another listener: startup fails and exits 75 (G6).
          python3 -c 'import socket,time; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(("0.0.0.0", 13399)); s.listen(); time.sleep(120)' &
          BLOCKER=$!
          sleep 1
          SCOPES_STATE_DIR=/tmp/scopes-nmos MXL_DOMAIN_SCAN_PATH=/dev/shm MXL_OUTPUT_DOMAIN_DIR=/dev/shm/scopes-nmos NMOS_PORT=13399 WEB_PORT=18199 \
            timeout 60 ./build/mxl-scopes; CODE=$?
          kill $BLOCKER
          test $CODE -eq 75 || { echo "NMOS port taken: exit $CODE, expected 75"; exit 1; }
          echo "exit codes ok"

      - name: Integration
        run: MXL_LIB_DIR=/opt/mxl/lib tests/integration/scope.sh build/mxl-scopes build/mxl-scopes-writer build/mxl-scopes-sample

      - name: Preview (MediaMTX release binary)
        run: |
          curl -fsSL -o /tmp/mediamtx.tgz https://github.com/bluenviron/mediamtx/releases/download/v1.20.1/mediamtx_v1.20.1_linux_amd64.tar.gz
          mkdir -p /tmp/mediamtx
          tar -xzf /tmp/mediamtx.tgz -C /tmp/mediamtx
          MXL_LIB_DIR=/opt/mxl/lib MEDIAMTX_BIN=/tmp/mediamtx/mediamtx tests/integration/preview.sh build/mxl-scopes
